<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBSIDION ($OBS) — System Upgrade & Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #050508;
      --card: rgba(16, 16, 24, 0.78);
      --border: rgba(251, 191, 36, 0.25);
      --gold-1: #FDE68A;
      --gold-2: #FBBF24;
      --gold-3: #D97706;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --emerald: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 15%, rgba(251, 191, 36, 0.14) 0%, transparent 52%),
        radial-gradient(circle at 15% 85%, rgba(217, 119, 6, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 45%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 88%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 44px 32px;
      text-align: center;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .logo-wrap {
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e1b29, #09090d);
      border: 1.5px solid rgba(251, 191, 36, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.22);
      animation: pulseGlow 3.2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 28px rgba(251, 191, 36, 0.2); transform: translateY(0); }
      50% { box-shadow: 0 0 46px rgba(251, 191, 36, 0.38); transform: translateY(-3px); }
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.32);
      color: var(--gold-1);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-2);
      box-shadow: 0 0 10px var(--gold-2);
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .brand {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      letter-spacing: 0.28em;
      color: var(--gold-2);
      margin-bottom: 10px;
      font-weight: 700;
    }
