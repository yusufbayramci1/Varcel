  <style>
    :root {
      --bg: #050507;
      --obsidian: #0b0c10;
      --obsidian-2: #12141b;
      --obsidian-3: #181b24;
      --border: rgba(212, 175, 55, 0.18);
      --border-strong: rgba(245, 208, 97, 0.42);
      --text: #f5f2e9;
      --muted: #9a968c;
      --gold: #d4af37;
      --gold-bright: #f5d061;
      --gold-dark: #8c6b16;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(212, 175, 55, 0.14), transparent 38%),
        radial-gradient(circle at 88% 12%, rgba(245, 208, 97, 0.08), transparent 36%),
        radial-gradient(circle at 50% 100%, rgba(212, 175, 55, 0.07), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1140px; margin: 0 auto; padding: 22px 16px 72px; }

    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 14px; padding: 16px 20px;
      background: linear-gradient(180deg, rgba(18, 20, 27, 0.92), rgba(11, 12, 16, 0.92));
      border: 1px solid var(--border);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(245, 208, 97, 0.12);
      position: sticky; top: 12px; z-index: 30;
    }

    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-badge {
      width: 44px; height: 44px; border-radius: 13px;
      background: linear-gradient(145deg, var(--gold-bright), var(--gold), var(--gold-dark));
      display: grid; place-items: center; font-weight: 900; color: #09090b; font-size: 1.25rem;
      box-shadow: 0 0 22px rgba(212, 175, 55, 0.35);
    }
    .brand h1 {
      font-size: 1.18rem; letter-spacing: 0.08em; font-weight: 800;
      background: linear-gradient(90deg, #fff7d6, var(--gold-bright), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand span { font-size: 0.78rem; color: var(--muted); display: block; }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }

    select, input, button {
      font: inherit; border-radius: 11px; border: 1px solid var(--border);
      background: var(--obsidian-2); color: var(--text); padding: 10px 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--gold-bright);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.14);
    }

    button:hover { border-color: var(--border-strong); transform: translateY(-1px); }
